<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/all.min.css">
  <link rel="stylesheet" href="css/output.css">
  <link rel="icon" href="assets/favicon.png">
  <title>Kanban Board | Task Manager</title>
</head>
<body class="bg-slate-100 font-[Inter] min-h-screen text-slate-800">
  <div class="min-h-screen flex flex-col">
    <!-- Header Bar -->
    <header class="bg-linear-to-r from-indigo-600 to-purple-600 text-white shadow-md sticky top-0 z-40">
      <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">

        <div class="flex items-center gap-3">
          <i class="fa-solid fa-table-columns text-2xl"></i>
          <h1 class="text-xl font-bold tracking-tight">Kanban</h1>
        </div>

        <div class="flex items-center gap-2">
          <button class="w-10 h-10 rounded-lg bg-white/20 hover:bg-white/30 transition-colors flex items-center justify-center" id="add-task-btn" title="Create Task">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- Modal Overlay (swap between flex and hidden) -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/50 z-50 items-center justify-center p-4 hidden">
      <!-- Modal Content -->
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto transform transition-all">
        <div class="flex items-center justify-between p-5 border-b border-slate-200">
          <h2 id="modal-title" class="text-lg font-semibold text-slate-800 flex items-center gap-2">Create New Task</h2>
          <button id="close-modal-btn" class="w-8 h-8 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-400 hover:text-slate-600 transition-colors">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>

        <form action"#" id="task-form" class="p-5" novalidate>
          <!-- Task Title -->
          <div class="mb-4">
            <label for="task-title" class="label">
              <i class="fa-solid fa-heading text-slate-400"></i>
              Task Title
              <span class="text-red-500">*</span>
            </label>

            <input type="text" id="task-title" name="title" placeholder="What needs to be done?" autocomplete="off" class="input">
            <p id="title-error" class="error-msg hidden"></p>
          </div>

          <!-- Priority & Date -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
            <!-- Priority -->
            <div>
              <label for="task-priority" class="label">
                <i class="fa-solid fa-flag text-slate-400"></i>
                Priority
              </label>

              <select name="priority" id="task-priority" class="input bg-white cursor-pointer">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>

            <!-- Due Date -->
            <div>
              <label for="task-due-date" class="label">
                <i class="fa-regular fa-calendar text-slate-400"></i>
                Due Date
              </label>

              <input type="date" id="task-due-date" name="dueDate" class="input">
              <p id="date-error" class="error-msg hidden"></p>
            </div>
          </div>

          <!-- Task Description -->
          <div class="mb-5">
            <label for="task-description" class="label">
              <i class="fa-solid fa-align-left text-slate-400"></i>
              Description
            </label>

            <textarea name="description" id="task-description" placeholder="Add more details about this task..." rows="3" maxlength="500" class="input resize-none"></textarea>
            <div class="flex justify-between items-center mt-1">
              <p id="description-error" class="error-msg hidden"></p>
              <p id="char-count" class="text-slate-400 text-xs ml-auto">0/500</p>
            </div>
          </div>

          <!-- Buttons -->
          <div class="flex gap-3">
            <button type="button" id="cancel-btn" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 px-4 rounded-lg transition-colors">
              Cancel
            </button>

            <button type="submit" id="submit-btn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors flex items-center justify-center gap-2">
              <i class="fa-solid fa-plus"></i>Add Task
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Kanban Board -->
    <main class="flex-1 px-4 py-8 bg-linear-to-br from-slate-100 via-slate-50 to-indigo-50/30">
      <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- To Do -->
        <div class="kanban-card" data-status="todo">
          <!-- Header -->
          <div class="flex items-center gap-3 mb-5">
            <!-- Icon -->
            <div class="w-10 h-10 bg-slate-100 rounded-xl flex items-center justify-center">
              <i class="fa-solid fa-clipboard-list  text-slate-500 text-lg"></i>
            </div>
            
            <!-- Beside Icon -->
            <div class="flex-1">
              <h2 class="font-semibold text-slate-800">To Do</h2>
              <p class="text-xs text-slate-400"><span data-role="tasks-count">0</span> tasks</p>
            </div>
          </div>
          
          <!-- Tasks -->
          <div class="flex-1 flex flex-col gap-4 overflow-y-auto pr-1 -mr-1" data-role="tasks-list">
            <div class="flex flex-col items-center justify-center py-12 text-slate-400">
              <i class="fa-regular fa-folder-open text-4xl mb-3 opacity-50"></i>
              <p class="text-sm">No tasks yet</p>
              <p class="text-xs mt-1">Click + to add one</p>
            </div>
          </div>
        </div>

        <!-- In Progress -->
        <div class="kanban-card" data-status="in-progress">
          <!-- Header -->
          <div class="flex items-center gap-3 mb-5">
            <!-- Icon -->
            <div class="w-10 h-10 bg-amber-50 rounded-xl flex items-center justify-center">
              <i class="fa-solid fa-spinner text-amber-500 text-lg"></i>
            </div>
            
            <!-- Beside Icon -->
            <div class="flex-1">
              <h2 class="font-semibold text-slate-800">In Progress</h2>
              <p class="text-xs text-slate-400"><span data-role="tasks-count">0</span> tasks</p>
            </div>
          </div>
          
          <!-- Tasks -->
          <div class="flex-1 flex flex-col gap-4 overflow-y-auto pr-1 -mr-1" data-role="tasks-list">
            <div class="flex flex-col items-center justify-center py-12 text-slate-400">
              <i class="fa-regular fa-folder-open text-4xl mb-3 opacity-50"></i>
              <p class="text-sm">No tasks yet</p>
              <p class="text-xs mt-1">Click + to add one</p>
            </div>
          </div>
        </div>

        <!-- Completed -->
        <div class="kanban-card" data-status="completed">
          <!-- Header -->
          <div class="flex items-center gap-3 mb-5">
            <!-- Icon -->
            <div class="w-10 h-10 bg-emerald-50 rounded-xl flex items-center justify-center">
              <i class="fa-solid fa-circle-check text-emerald-500 text-lg"></i>
            </div>
            
            <!-- Beside Icon -->
            <div class="flex-1">
              <h2 class="font-semibold text-slate-800">Completed</h2>
              <p class="text-xs text-slate-400"><span data-role="tasks-count">0</span> tasks</p>
            </div>
          </div>
          
          <!-- Tasks -->
          <div class="flex-1 flex flex-col gap-4 overflow-y-auto pr-1 -mr-1" data-role="tasks-list">
            <div class="flex flex-col items-center justify-center py-12 text-slate-400">
              <i class="fa-regular fa-folder-open text-4xl mb-3 opacity-50"></i>
              <p class="text-sm">No tasks yet</p>
              <p class="text-xs mt-1">Click + to add one</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-linear-to-r from-slate-800 to-slate-900 text-center py-5 mt-auto border-t border-slate-700/50">
      <p class="text-slate-400 text-sm flex items-center justify-center gap-2">
        Made with
        <i class="fa-solid fa-heart text-rose-500 animate-pulse"></i>
        by Youssef Beshnack
      </p>
    </footer>
  </div>

  <script src="js/index.js" type="module"></script>
</body>
</html>
